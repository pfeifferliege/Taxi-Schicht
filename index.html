<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Schichtrechner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.27/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .btn-primary { transition: all 0.2s ease-in-out; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .summary-card { transition: transform 0.2s ease-in-out; }
        .summary-card:hover { transform: scale(1.02); }
        .action-btn { transition: all 0.2s ease-in-out; }
        .action-btn:hover { transform: translateY(-1px); }
        .cash-input-group { max-height: 0; overflow: hidden; transition: max-height 0.5s ease-in-out, opacity 0.3s ease-in-out; opacity: 0; }
        .cash-input-group.visible { max-height: 500px; opacity: 1; }
        .modal { position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 50; }
        .modal.visible { display: flex; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4 sm:p-6">
    <div class="w-full max-w-2xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-4xl font-bold text-yellow-400">Taxi-Schichtrechner</h1>
            <p class="text-gray-400 mt-2">Ihre Daten sind sicher gespeichert und griffbereit.</p>
        </header>

        <div class="bg-gray-800 p-4 rounded-2xl shadow-lg mb-6 border-b-2 border-yellow-500">
             <label for="fahrername" class="block text-sm font-medium text-gray-300 mb-1">Fahrername (wird dauerhaft gespeichert)</label>
             <input type="text" id="fahrername" placeholder="Ihr Name" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition">
        </div>

        <div class="bg-gray-800 p-6 rounded-2xl shadow-lg mb-8">
            <h2 id="form-title" class="text-2xl font-semibold mb-4 text-center">Neue Fahrt hinzufügen</h2>
            <form id="trip-form" class="space-y-4">
                
                <div id="payment-method-selection" class="space-y-4">
                    <div>
                        <span class="block text-sm font-medium text-gray-300 mb-2">Zahlungsart wählen</span>
                        <div class="grid grid-cols-2 gap-4">
                            <button type="button" data-method="Bar" class="payment-method-btn bg-gray-700 border-2 border-transparent text-white font-semibold py-3 rounded-lg transition-all duration-200">Bar</button>
                            <button type="button" data-method="EC" class="payment-method-btn bg-gray-700 border-2 border-transparent text-white font-semibold py-3 rounded-lg transition-all duration-200">EC-Karte</button>
                        </div>
                    </div>
                </div>

                <div id="trip-input-fields" class="space-y-4 hidden">
                    <div>
                        <label for="fare" class="block text-sm font-medium text-gray-300 mb-1">Fahrpreis (€)</label>
                        <input type="number" id="fare" step="0.01" min="0" placeholder="0.00" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition">
                    </div>

                     <div id="cash-input-group" class="space-y-4 cash-input-group">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="gegeben" class="block text-sm font-medium text-gray-300 mb-1">Gegeben (€)</label>
                                <input type="number" id="gegeben" step="0.01" min="0" placeholder="0.00" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition">
                            </div>
                            <div>
                                <label for="rueckgeldTats" class="block text-sm font-medium text-gray-300 mb-1">Rückgeld tats. (€)</label>
                                <input type="number" id="rueckgeldTats" step="0.01" min="0" placeholder="0.00" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-1">Soll-Rückgeld (Info)</label>
                            <input type="number" id="rueckgeld" readonly class="w-full bg-gray-600 border border-gray-500 rounded-lg p-3 text-gray-300 cursor-not-allowed">
                        </div>
                    </div>

                    <div>
                        <label for="tip" class="block text-sm font-medium text-gray-300 mb-1">Trinkgeld (€)</label>
                        <input type="number" id="tip" step="0.01" min="0" placeholder="Trinkgeld" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition">
                    </div>

                    <button type="submit" id="submit-btn" class="w-full btn-primary bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-3 rounded-lg shadow-md text-lg uppercase tracking-wider">
                        Hinzufügen
                    </button>
                    <button type="button" id="cancel-edit-btn" class="w-full hidden bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 rounded-lg mt-2 transition">
                        Abbrechen
                    </button>
                </div>
            </form>
        </div>

        <div class="mb-8">
            <h2 class="text-2xl font-semibold mb-4 text-center">Aktuelle Schicht</h2>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="summary-card bg-green-500/20 border border-green-500 p-4 rounded-xl text-center">
                    <h3 class="text-xs font-medium text-green-300 uppercase">Bar</h3>
                    <p id="cash-total" class="text-2xl font-bold">0.00 €</p>
                </div>
                <div class="summary-card bg-blue-500/20 border border-blue-500 p-4 rounded-xl text-center">
                    <h3 class="text-xs font-medium text-blue-300 uppercase">EC</h3>
                    <p id="card-total" class="text-2xl font-bold">0.00 €</p>
                </div>
                <div class="summary-card bg-purple-500/20 border border-purple-500 p-4 rounded-xl text-center">
                    <h3 class="text-xs font-medium text-purple-300 uppercase">Tip</h3>
                    <p id="tip-total" class="text-2xl font-bold">0.00 €</p>
                </div>
                <div class="summary-card bg-yellow-500/20 border border-yellow-500 p-4 rounded-xl text-center">
                    <h3 class="text-xs font-medium text-yellow-300 uppercase">Gesamt</h3>
                    <p id="fare-grand-total" class="text-2xl font-bold">0.00 €</p>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-2xl shadow-lg">
             <div class="flex flex-wrap justify-end items-center mb-4 gap-3">
                <h2 class="text-2xl font-semibold mr-auto">Protokoll</h2>
                <div class="flex items-center gap-2">
                    <button id="end-shift-btn" class="action-btn bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded-lg flex items-center gap-2 text-sm">
                        Abschließen
                    </button>
                    <button id="show-overall-summary-btn" class="action-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-lg flex items-center gap-2 text-sm">
                        Historie
                    </button>
                </div>
            </div>
            <div id="trips-list" class="space-y-3 max-h-96 overflow-y-auto pr-2">
                <p id="no-trips-message" class="text-gray-400 text-center py-4">Keine Fahrten vorhanden.</p>
            </div>
        </div>
    </div>

    <div id="confirmation-modal" class="modal p-4">
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center">
            <h3 class="text-xl font-bold mb-4">Schicht abschließen?</h3>
            <div class="flex justify-center gap-4">
                <button id="confirm-end-shift" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg">Ja</button>
                <button id="cancel-end-shift" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg">Nein</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fahrernameInput = document.getElementById('fahrername');
            const tripForm = document.getElementById('trip-form');
            const fareInput = document.getElementById('fare');
            const tipInput = document.getElementById('tip');
            const paymentMethodButtons = document.querySelectorAll('.payment-method-btn');
            const tripsList = document.getElementById('trips-list');
            const noTripsMessage = document.getElementById('no-trips-message');
            const formTitle = document.getElementById('form-title');
            const submitBtn = document.getElementById('submit-btn');
            const cancelEditBtn = document.getElementById('cancel-edit-btn');
            const paymentMethodSelection = document.getElementById('payment-method-selection');
            const tripInputFields = document.getElementById('trip-input-fields');
            const cashInputGroup = document.getElementById('cash-input-group');
            const gegebenInput = document.getElementById('gegeben');
            const rueckgeldInput = document.getElementById('rueckgeld');
            const rueckgeldTatsInput = document.getElementById('rueckgeldTats');

            let trips = JSON.parse(localStorage.getItem('taxiShiftData')) || [];
            let allCompletedShifts = JSON.parse(localStorage.getItem('allCompletedShifts')) || [];
            let selectedPaymentMethod = '';
            let editIndex = -1;

            // Name dauerhaft laden
            fahrernameInput.value = localStorage.getItem('fahrername') || '';
            fahrernameInput.addEventListener('input', () => {
                localStorage.setItem('fahrername', fahrernameInput.value);
            });

            const formatCurrency = (amount) => parseFloat(amount).toFixed(2).replace('.', ',') + ' €';

            const calculateAll = () => {
                const fare = parseFloat(fareInput.value) || 0;
                const geg = parseFloat(gegebenInput.value) || 0;
                const tats = parseFloat(rueckgeldTatsInput.value) || 0;
                
                if (geg > 0 && geg >= fare) {
                    rueckgeldInput.value = (geg - fare).toFixed(2);
                    if (selectedPaymentMethod === 'Bar') {
                        tipInput.value = Math.max(0, geg - fare - tats).toFixed(2);
                    }
                }
            };

            const renderTrips = () => {
                let cash = 0, card = 0, tips = 0;
                tripsList.innerHTML = '';
                
                if (trips.length === 0) {
                    noTripsMessage.classList.remove('hidden');
                    tripsList.appendChild(noTripsMessage);
                } else {
                    noTripsMessage.classList.add('hidden');
                    [...trips].reverse().forEach((trip, revIdx) => {
                        const idx = trips.length - 1 - revIdx;
                        const tFare = parseFloat(trip.fare);
                        const tTip = parseFloat(trip.tip);
                        
                        if(trip.method === 'Bar') cash += tFare; else card += tFare;
                        tips += tTip;

                        const item = document.createElement('div');
                        item.className = `flex justify-between items-center bg-gray-700 p-3 rounded-lg shadow border-l-4 ${trip.method === 'Bar' ? 'border-green-500' : 'border-blue-500'}`;
                        item.innerHTML = `
                            <div>
                                <span class="font-bold text-lg">#${idx + 1} | ${formatCurrency(tFare)}</span>
                                <div class="text-xs text-gray-400">${trip.timestamp} | Tip: ${formatCurrency(tTip)}</div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.editTrip(${idx})" class="p-2 text-yellow-400 hover:bg-yellow-400/10 rounded">✎</button>
                                <button onclick="window.deleteTrip(${idx})" class="p-2 text-red-400 hover:bg-red-400/10 rounded">✕</button>
                            </div>`;
                        tripsList.appendChild(item);
                    });
                }
                document.getElementById('cash-total').textContent = formatCurrency(cash);
                document.getElementById('card-total').textContent = formatCurrency(card);
                document.getElementById('tip-total').textContent = formatCurrency(tips);
                document.getElementById('fare-grand-total').textContent = formatCurrency(cash + card);
            };

            window.editTrip = (idx) => {
                editIndex = idx;
                const t = trips[idx];
                selectedPaymentMethod = t.method;
                fareInput.value = t.fare;
                tipInput.value = t.tip;
                formTitle.textContent = "Fahrt #" + (idx + 1) + " bearbeiten";
                submitBtn.textContent = "Speichern";
                cancelEditBtn.classList.remove('hidden');
                paymentMethodSelection.classList.add('hidden');
                tripInputFields.classList.remove('hidden');
                if (t.method === 'Bar') { cashInputGroup.classList.add('visible'); tipInput.readOnly = true; }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.deleteTrip = (idx) => { if(confirm("Löschen?")) { trips.splice(idx, 1); save(); } };

            const save = () => {
                localStorage.setItem('taxiShiftData', JSON.stringify(trips));
                renderTrips();
            };

            const resetForm = () => {
                editIndex = -1;
                formTitle.textContent = "Neue Fahrt hinzufügen";
                submitBtn.textContent = "Hinzufügen";
                cancelEditBtn.classList.add('hidden');
                tripForm.reset();
                paymentMethodSelection.classList.remove('hidden');
                tripInputFields.classList.add('hidden');
                cashInputGroup.classList.remove('visible');
                paymentMethodButtons.forEach(b => b.classList.remove('bg-yellow-500', 'text-gray-900'));
            };

            paymentMethodButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedPaymentMethod = btn.dataset.method;
                    paymentMethodSelection.classList.add('hidden');
                    tripInputFields.classList.remove('hidden');
                    if (selectedPaymentMethod === 'Bar') {
                        cashInputGroup.classList.add('visible');
                        tipInput.readOnly = true;
                        tipInput.classList.add('bg-gray-600');
                    } else {
                        cashInputGroup.classList.remove('visible');
                        tipInput.readOnly = false;
                        tipInput.classList.remove('bg-gray-600');
                    }
                    fareInput.focus();
                });
            });

            fareInput.addEventListener('input', calculateAll);
            gegebenInput.addEventListener('input', calculateAll);
            rueckgeldTatsInput.addEventListener('input', calculateAll);
            cancelEditBtn.addEventListener('click', resetForm);

            tripForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const nt = {
                    fare: parseFloat(fareInput.value).toFixed(2),
                    tip: (parseFloat(tipInput.value) || 0).toFixed(2),
                    method: selectedPaymentMethod,
                    timestamp: editIndex > -1 ? trips[editIndex].timestamp : new Date().toLocaleString("de-DE")
                };
                if (editIndex > -1) trips[editIndex] = nt; else trips.push(nt);
                save();
                resetForm();
            });

            document.getElementById('end-shift-btn').addEventListener('click', () => {
                if(trips.length > 0) document.getElementById('confirmation-modal').classList.add('visible');
            });
            
            document.getElementById('confirm-end-shift').addEventListener('click', () => {
                allCompletedShifts.push({ date: new Date().toLocaleString(), trips: [...trips] });
                localStorage.setItem('allCompletedShifts', JSON.stringify(allCompletedShifts));
                trips = [];
                save();
                document.getElementById('confirmation-modal').classList.remove('visible');
            });

            document.getElementById('cancel-end-shift').addEventListener('click', () => {
                document.getElementById('confirmation-modal').classList.remove('visible');
            });

            renderTrips();
        });
    </script>
</body>
</html>
